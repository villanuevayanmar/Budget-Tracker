<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <h2>Budget Tracker</h2>
        <p>Please enter your name to open your budget dashboard:</p>
        <input type="text" id="username" placeholder="Your Name">
        <button id="login-btn">Start</button>
    </div>

    <div id="dashboard-container" style="display: none;">
        <h2>Welcome, <span id="user-display"></span>!</h2>
        
        <div class="summary">
            <div>Income<br><span id="total-income">₱0.00</span></div>
            <div>Expenses<br><span id="total-expenses">₱0.00</span></div>
        </div>
        <div id="net-balance">Net Balance: ₱0.00</div>

        <hr>

        <h3>Log Transaction</h3>
        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <input type="text" id="description" placeholder="Description (e.g., Lunch, Groceries, Salary)">
        <input type="number" id="amount" placeholder="Amount (₱)">
        <button id="add-btn">Add Transaction</button>

        <div class="history-container">
            <div class="history-column">
                <h3>Income History</h3>
                <ul id="income-list"></ul>
            </div>
            <div class="history-column">
                <h3>Expense History</h3>
                <ul id="expense-list"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
